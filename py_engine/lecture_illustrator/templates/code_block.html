<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "PatrickHand"; src: url("fonts/PatrickHand.ttf"); }
  :root {
    --paper: #f4efe3;
    --ink: #26323d;
    --accent: #b5533c;
    --muted: #8a8372;
  }
  html, body { margin: 0; width: 100%; height: 100%; background: var(--paper); overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #grain {
    position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(rgba(60,50,30,.07) 1px, transparent 1.2px);
    background-size: 7px 7px;
  }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  text { font-family: "Courier New", Courier, monospace; fill: var(--ink); }
  .title-text { font-family: "PatrickHand", cursive; fill: var(--ink); }
</style>
</head>
<body>
<div id="stage"><svg id="svg"></svg></div>
<div id="grain"></div>
<script src="vendor/rough.js"></script>
<script>
const SVGNS = "http://www.w3.org/2000/svg";
const W = 1920, H = 1080;
let EDITOR_FRAME = null, DOTS = [], TITLE_LINE = null, LINES = [];

function roughPath(gen, drawable, color, width) {
  const g = document.createElementNS(SVGNS, "g");
  gen.toPaths(drawable).forEach(p => {
    const el = document.createElementNS(SVGNS, "path");
    el.setAttribute("d", p.d);
    el.setAttribute("fill", "none");
    el.setAttribute("stroke", color);
    el.setAttribute("stroke-width", width);
    el.setAttribute("stroke-linecap", "round");
    el.setAttribute("pathLength", "1");
    el.setAttribute("stroke-dasharray", "1");
    el.setAttribute("stroke-dashoffset", "1");
    g.appendChild(el);
  });
  return g;
}

function setDraw(g, p) {
  if (!g) return;
  g.querySelectorAll("path").forEach(el => el.setAttribute("stroke-dashoffset", String(1 - p)));
}

function load(scene) {
  const svg = document.getElementById("svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";
  const gen = rough.generator({ options: { roughness: 1.5, bowing: 1.3, seed: 101 } });

  // Tiêu đề bài giảng - Tự động co cỡ chữ nếu dài
  const title = document.createElementNS(SVGNS, "text");
  title.setAttribute("x", 140); title.setAttribute("y", 160);
  const titleText = scene.title || "Minh họa mã nguồn";
  const titleFontSize = titleText.length > 22 ? 80 : (titleText.length > 14 ? 98 : 110);
  title.setAttribute("font-size", titleFontSize); title.setAttribute("font-weight", 700);
  title.setAttribute("class", "title-text");
  title.textContent = titleText;
  svg.appendChild(title);

  const tw = Math.min(1500, Math.max(350, titleText.length * (titleFontSize * 0.55)));
  TITLE_LINE = roughPath(gen, gen.line(140, 195, 140 + tw, 202), "#b5533c", 8);
  svg.appendChild(TITLE_LINE);

  // Khung Terminal / Code Editor - Giới hạn an toàn edY + edH = 870px
  const edX = 140, edY = 240, edW = 1640, edH = 630;
  EDITOR_FRAME = roughPath(gen, gen.rectangle(edX, edY, edW, edH, { roughness: 1.6 }), "#26323d", 7);
  svg.appendChild(EDITOR_FRAME);

  // Đường kẻ phân cách Header của Editor
  const headerLine = roughPath(gen, gen.line(edX, edY + 65, edX + edW, edY + 65), "#8a8372", 4);
  svg.appendChild(headerLine);

  // 3 nút macOS
  DOTS = [
    roughPath(gen, gen.circle(edX + 45, edY + 35, 18), "#b5533c", 4),
    roughPath(gen, gen.circle(edX + 85, edY + 35, 18), "#8a8372", 4),
    roughPath(gen, gen.circle(edX + 125, edY + 35, 18), "#26323d", 4),
  ];
  DOTS.forEach(d => svg.appendChild(d));

  // Các dòng code - Khoảng cách an toàn gap = 68px
  const steps = scene.steps || [];
  const top = edY + 130, gap = 68;
  LINES = steps.map((s, i) => {
    const y = top + i * gap;

    // Số thứ tự dòng
    const lineNo = document.createElementNS(SVGNS, "text");
    lineNo.setAttribute("x", edX + 60); lineNo.setAttribute("y", y);
    lineNo.setAttribute("font-size", 42); lineNo.setAttribute("fill", "#8a8372");
    lineNo.textContent = String(i + 1).padStart(2, "0");
    svg.appendChild(lineNo);

    // Chữ nội dung code
    const codeText = document.createElementNS(SVGNS, "text");
    codeText.setAttribute("x", edX + 150); codeText.setAttribute("y", y);
    codeText.setAttribute("font-size", 46); codeText.setAttribute("font-weight", 700);
    svg.appendChild(codeText);

    return { lineNo, codeText, text: s.label || "" };
  });
}

function renderAt(t, starts) {
  const clamp = v => Math.max(0, Math.min(1, v));
  setDraw(TITLE_LINE, clamp((t - 0.1) / 0.7));
  setDraw(EDITOR_FRAME, clamp((t - 0.15) / 0.8));
  DOTS.forEach(d => setDraw(d, clamp((t - 0.3) / 0.5)));

  let active = -1;
  starts.forEach((s, k) => { if (t >= s) active = k; });

  LINES.forEach((ln, k) => {
    const chars = Math.floor(clamp((t - starts[k] - 0.05) / 0.7) * ln.text.length);
    ln.codeText.textContent = ln.text.slice(0, chars);
    // Highlight dòng đang đọc màu đỏ gạch, các dòng khác màu xanh mực
    ln.codeText.setAttribute("fill", k === active ? "#b5533c" : "#26323d");
  });
}

window.__load = load; window.__renderAt = renderAt;
</script>
</body>
</html>
