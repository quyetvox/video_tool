<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "PatrickHand"; src: url("fonts/PatrickHand.ttf"); }
  :root {
    --paper: #f4efe3;
    --ink: #26323d;
    --accent: #b5533c;
    --muted: #8a8372;
  }
  html, body { margin: 0; width: 100%; height: 100%; background: var(--paper); overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #grain {
    position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(rgba(60,50,30,.07) 1px, transparent 1.2px);
    background-size: 7px 7px;
  }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  text { font-family: "PatrickHand", cursive; fill: var(--ink); }
</style>
</head>
<body>
<div id="stage"><svg id="svg"></svg></div>
<div id="grain"></div>
<script src="vendor/rough.js"></script>
<script>
const SVGNS = "http://www.w3.org/2000/svg";
const W = 1920, H = 1080;
let TITLE_LINE = null, PIPELINE_STATIONS = [], CONNECTORS = [], DATA_PARTICLES = [];
let STEP_ITEMS = [];

function roughPath(gen, drawable, color, width) {
  const g = document.createElementNS(SVGNS, "g");
  gen.toPaths(drawable).forEach(p => {
    const el = document.createElementNS(SVGNS, "path");
    el.setAttribute("d", p.d);
    el.setAttribute("fill", "none");
    el.setAttribute("stroke", color);
    el.setAttribute("stroke-width", width);
    el.setAttribute("stroke-linecap", "round");
    el.setAttribute("pathLength", "1");
    el.setAttribute("stroke-dasharray", "1");
    el.setAttribute("stroke-dashoffset", "1");
    g.appendChild(el);
  });
  return g;
}

function setDraw(g, p) {
  if (!g) return;
  g.querySelectorAll("path").forEach(el => el.setAttribute("stroke-dashoffset", String(1 - p)));
}

function load(scene) {
  const svg = document.getElementById("svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";
  const gen = rough.generator({ options: { roughness: 1.3, bowing: 1.1, seed: 88 } });

  // 1. Tiêu đề - Tự động co cỡ chữ nếu dài
  const title = document.createElementNS(SVGNS, "text");
  title.setAttribute("x", 140); title.setAttribute("y", 140);
  const titleText = scene.title || "Kiến trúc RAG & Truy vấn Tri thức (Retrieval Pipeline)";
  const titleFontSize = titleText.length > 22 ? 78 : (titleText.length > 14 ? 90 : 100);
  title.setAttribute("font-size", titleFontSize); title.setAttribute("font-weight", 700);
  title.textContent = titleText;
  svg.appendChild(title);

  const tw = Math.min(1600, Math.max(350, titleText.length * (titleFontSize * 0.55)));
  TITLE_LINE = roughPath(gen, gen.line(140, 172, 140 + tw, 178), "#b5533c", 8);
  svg.appendChild(TITLE_LINE);

  // 2. 4 Trạm xử lý chính nằm ngang (cx: 260, 700, 1160, 1620; cy: 420)
  const cy = 420;
  const stations = [
    { label: "USER QUERY", sub: "Câu hỏi & Yêu cầu", cx: 260, w: 230, h: 140, color: "#26323d" },
    { label: "EMBEDDING", sub: "Chuyển thành Vector", cx: 700, w: 240, h: 140, color: "#26323d" },
    { label: "VECTOR DB", sub: "Truy vấn tương đồng", cx: 1160, w: 240, h: 150, color: "#26323d", isDb: true },
    { label: "LLM REASON", sub: "Tổng hợp câu trả lời", cx: 1620, w: 250, h: 140, color: "#b5533c" }
  ];

  PIPELINE_STATIONS = stations.map(s => {
    let shape;
    if (s.isDb) {
      // Vẽ cylinder 3 tầng thô cho Database
      const g = document.createElementNS(SVGNS, "g");
      const c1 = roughPath(gen, gen.ellipse(s.cx, cy - 45, s.w - 30, 40, { roughness: 1.1 }), s.color, 3.5);
      const c2 = roughPath(gen, gen.ellipse(s.cx, cy, s.w - 30, 40, { roughness: 1.1 }), s.color, 3.5);
      const c3 = roughPath(gen, gen.ellipse(s.cx, cy + 45, s.w - 30, 40, { roughness: 1.1 }), s.color, 3.5);
      const l1 = roughPath(gen, gen.line(s.cx - (s.w - 30)/2, cy - 45, s.cx - (s.w - 30)/2, cy + 45), s.color, 3.5);
      const l2 = roughPath(gen, gen.line(s.cx + (s.w - 30)/2, cy - 45, s.cx + (s.w - 30)/2, cy + 45), s.color, 3.5);
      g.appendChild(c1); g.appendChild(c2); g.appendChild(c3); g.appendChild(l1); g.appendChild(l2);
      svg.appendChild(g);
      shape = g;
    } else {
      shape = roughPath(gen, gen.rectangle(s.cx - s.w/2, cy - s.h/2, s.w, s.h, { roughness: 1.2 }), s.color, 4);
      svg.appendChild(shape);
    }

    const t1 = document.createElementNS(SVGNS, "text");
    t1.setAttribute("x", s.cx); t1.setAttribute("y", cy - 12);
    t1.setAttribute("font-size", 34); t1.setAttribute("font-weight", 700);
    t1.setAttribute("text-anchor", "middle"); t1.setAttribute("fill", s.color);
    t1.textContent = s.label;
    svg.appendChild(t1);

    const t2 = document.createElementNS(SVGNS, "text");
    t2.setAttribute("x", s.cx); t2.setAttribute("y", cy + 24);
    t2.setAttribute("font-size", 24); t2.setAttribute("font-weight", 600);
    t2.setAttribute("text-anchor", "middle"); t2.setAttribute("fill", "#8a8372");
    t2.textContent = s.sub;
    svg.appendChild(t2);

    return { ...s, shape, t1, t2 };
  });

  // 3. Đường dẫn dữ liệu và mũi tên luồng ngang
  CONNECTORS = [];
  // Tuyến 1: Query -> Embedding
  const c1 = roughPath(gen, gen.line(375, cy, 580, cy, { roughness: 1.1 }), "#b5533c", 4.0);
  // Tuyến 2: Embedding -> Vector DB
  const c2 = roughPath(gen, gen.line(820, cy, 1030, cy, { roughness: 1.1 }), "#b5533c", 4.0);
  // Tuyến 3: Vector DB -> LLM (Top-K Chunks)
  const c3 = roughPath(gen, gen.line(1280, cy, 1495, cy, { roughness: 1.1 }), "#b5533c", 4.0);
  // Tuyến 4: Cầu vồng bắc ngang Query trực tiếp sang LLM (User prompt context)
  const c4 = roughPath(gen, gen.curve([[260, 350], [960, 240], [1620, 350]], { roughness: 1.4 }), "#8a8372", 2.5);

  svg.appendChild(c1); svg.appendChild(c2); svg.appendChild(c3); svg.appendChild(c4);
  CONNECTORS.push(c1, c2, c3, c4);

  // Nhãn cầu vồng bắc ngang
  const promptLabel = document.createElementNS(SVGNS, "text");
  promptLabel.setAttribute("x", 960); promptLabel.setAttribute("y", 225);
  promptLabel.setAttribute("font-size", 24); promptLabel.setAttribute("font-weight", 600);
  promptLabel.setAttribute("text-anchor", "middle"); promptLabel.setAttribute("fill", "#8a8372");
  promptLabel.textContent = "Direct Prompt Injection";
  svg.appendChild(promptLabel);

  // 4. Các hạt dữ liệu (Data Packets) chuyển động dọc theo pipeline
  DATA_PARTICLES = [];
  for (let i = 0; i < 15; i++) {
    const dot = document.createElementNS(SVGNS, "circle");
    dot.setAttribute("r", "8");
    dot.setAttribute("fill", "#b5533c");
    dot.setAttribute("opacity", "0");
    svg.appendChild(dot);
    DATA_PARTICLES.push({ el: dot, phase: i / 15 });
  }

  // 5. Chú thích diễn giải theo câu bên dưới (Safe Zone y <= 860)
  const steps = scene.steps || [];
  const n = steps.length;
  STEP_ITEMS = steps.map((s, idx) => {
    const group = document.createElementNS(SVGNS, "g");
    let itemX = W / 2, itemY = 750 + idx * 46;
    if (n <= 3) {
      const colW = 540;
      const startX = (W - (n * colW)) / 2 + colW / 2;
      itemX = startX + idx * colW;
      itemY = 800;
    }

    const txt = document.createElementNS(SVGNS, "text");
    txt.setAttribute("x", itemX); txt.setAttribute("y", itemY);
    txt.setAttribute("font-size", n <= 3 ? 46 : 42);
    txt.setAttribute("font-weight", 700);
    txt.setAttribute("text-anchor", "middle");
    txt.textContent = `${idx + 1}. ${s.label || ""}`;
    group.appendChild(txt);
    svg.appendChild(group);

    return { group, txt, idx };
  });
}

function renderAt(t, starts) {
  const clamp = v => Math.max(0, Math.min(1, v));
  setDraw(TITLE_LINE, clamp((t - 0.1) / 0.5));

  // Vẽ các trạm
  PIPELINE_STATIONS.forEach((st, i) => {
    setDraw(st.shape, clamp((t - 0.2 - i * 0.12) / 0.5));
  });

  // Vẽ các đường nối
  CONNECTORS.forEach((c, i) => {
    setDraw(c, clamp((t - 0.5 - i * 0.1) / 0.5));
  });

  // Luồng dữ liệu bay từ trái sang phải
  if (t > 0.8) {
    const loopT = (t - 0.8) % 2.5;
    const progress = loopT / 2.5; // 0 -> 1

    DATA_PARTICLES.forEach(p => {
      const curProg = (progress + p.phase) % 1.0;
      const startX = 260, endX = 1620;
      const curX = startX + curProg * (endX - startX);
      const curY = 420;

      p.el.setAttribute("cx", String(curX));
      p.el.setAttribute("cy", String(curY));
      p.el.setAttribute("opacity", String(curProg < 0.05 || curProg > 0.95 ? 0 : 0.85));
    });
  }

  // Cập nhật câu diễn giải theo mốc starts
  let activeStep = 0;
  starts.forEach((st, idx) => { if (t >= st) activeStep = idx; });

  STEP_ITEMS.forEach(item => {
    const st = starts[item.idx] || 0;
    const opacity = clamp((t - st) / 0.4);
    item.group.setAttribute("opacity", String(opacity));
    item.txt.setAttribute("fill", item.idx === activeStep ? "#b5533c" : "#26323d");
  });
}

window.__load = load; window.__renderAt = renderAt;
</script>
</body>
</html>
