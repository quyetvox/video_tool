<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "PatrickHand"; src: url("fonts/PatrickHand.ttf"); }
  :root {
    --paper: #f4efe3;
    --ink: #26323d;
    --accent: #b5533c;
    --muted: #8a8372;
  }
  html, body { margin: 0; width: 100%; height: 100%; background: var(--paper); overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #grain {
    position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(rgba(60,50,30,.07) 1px, transparent 1.2px);
    background-size: 7px 7px;
  }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  text { font-family: "PatrickHand", cursive; fill: var(--ink); text-anchor: middle; }
</style>
</head>
<body>
<div id="stage"><svg id="svg"></svg></div>
<div id="grain"></div>
<script src="vendor/rough.js"></script>
<script>
const SVGNS = "http://www.w3.org/2000/svg";
const W = 1920, H = 1080;
let TITLE = null, UNDERLINE = null, STEPS = [];

function roughPath(gen, drawable, color, width) {
  const g = document.createElementNS(SVGNS, "g");
  gen.toPaths(drawable).forEach(p => {
    const el = document.createElementNS(SVGNS, "path");
    el.setAttribute("d", p.d);
    el.setAttribute("fill", "none");
    el.setAttribute("stroke", color);
    el.setAttribute("stroke-width", width);
    el.setAttribute("stroke-linecap", "round");
    el.setAttribute("pathLength", "1");
    el.setAttribute("stroke-dasharray", "1");
    el.setAttribute("stroke-dashoffset", "1");
    g.appendChild(el);
  });
  return g;
}

function setDraw(g, p) {
  g.querySelectorAll("path").forEach(el => el.setAttribute("stroke-dashoffset", String(1 - p)));
}

function load(scene) {
  const svg = document.getElementById("svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";
  const gen = rough.generator({ options: { roughness: 1.5, bowing: 1.3, seed: 42 } });

  // Tiêu đề lớn ở trung tâm - Tự động co cỡ chữ nếu dài
  const title = document.createElementNS(SVGNS, "text");
  title.setAttribute("x", W / 2); title.setAttribute("y", 380);
  const titleText = scene.title || "";
  const titleFontSize = titleText.length > 20 ? 95 : (titleText.length > 12 ? 125 : 160);
  title.setAttribute("font-size", titleFontSize); title.setAttribute("font-weight", 700);
  title.textContent = titleText;
  svg.appendChild(title);
  TITLE = title;

  const tw = Math.min(1600, Math.max(500, titleText.length * (titleFontSize * 0.55)));
  const underline = roughPath(gen, gen.line(W/2 - tw/2, 430, W/2 + tw/2, 440), "#b5533c", 10);
  svg.appendChild(underline);
  UNDERLINE = underline;

  // Ý chính / phụ đề dưới tiêu đề
  STEPS = (scene.steps || []).map((s, i) => {
    const y = 560 + i * 110;
    const txt = document.createElementNS(SVGNS, "text");
    txt.setAttribute("x", W / 2); txt.setAttribute("y", y);
    txt.setAttribute("font-size", 84);
    txt.setAttribute("fill", i === 0 ? "#26323d" : "#8a8372");
    svg.appendChild(txt);
    return { txt, text: s.label || "" };
  });
}

function renderAt(t, starts) {
  const clamp = v => Math.max(0, Math.min(1, v));
  setDraw(UNDERLINE, clamp((t - 0.2) / 0.8));
  STEPS.forEach((st, k) => {
    const chars = Math.floor(clamp((t - starts[k] - 0.1) / 0.8) * st.text.length);
    st.txt.textContent = st.text.slice(0, chars);
  });
}

window.__load = load; window.__renderAt = renderAt;
</script>
</body>
</html>
