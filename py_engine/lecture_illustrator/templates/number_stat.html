<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "PatrickHand"; src: url("fonts/PatrickHand.ttf"); }
  :root {
    --paper: #f4efe3;
    --ink: #26323d;
    --accent: #b5533c;
    --muted: #8a8372;
  }
  html, body { margin: 0; width: 100%; height: 100%; background: var(--paper); overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #grain {
    position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(rgba(60,50,30,.07) 1px, transparent 1.2px);
    background-size: 7px 7px;
  }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  text { font-family: "PatrickHand", cursive; fill: var(--ink); }
</style>
</head>
<body>
<div id="stage"><svg id="svg"></svg></div>
<div id="grain"></div>
<script src="vendor/rough.js"></script>
<script>
const SVGNS = "http://www.w3.org/2000/svg";
const W = 1920, H = 1080;
let CIRCLE = null, TITLE_LINE = null, ITEMS = [];

function roughPath(gen, drawable, color, width) {
  const g = document.createElementNS(SVGNS, "g");
  gen.toPaths(drawable).forEach(p => {
    const el = document.createElementNS(SVGNS, "path");
    el.setAttribute("d", p.d);
    el.setAttribute("fill", "none");
    el.setAttribute("stroke", color);
    el.setAttribute("stroke-width", width);
    el.setAttribute("stroke-linecap", "round");
    el.setAttribute("pathLength", "1");
    el.setAttribute("stroke-dasharray", "1");
    el.setAttribute("stroke-dashoffset", "1");
    g.appendChild(el);
  });
  return g;
}

function setDraw(g, p) {
  if (!g) return;
  g.querySelectorAll("path").forEach(el => el.setAttribute("stroke-dashoffset", String(1 - p)));
}

function load(scene) {
  const svg = document.getElementById("svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";
  const gen = rough.generator({ options: { roughness: 1.6, bowing: 1.3, seed: 55 } });

  // Tiêu đề - Tự động co cỡ chữ nếu dài
  const title = document.createElementNS(SVGNS, "text");
  title.setAttribute("x", 140); title.setAttribute("y", 180);
  const titleText = scene.title || "Số liệu quan trọng";
  const titleFontSize = titleText.length > 22 ? 80 : (titleText.length > 14 ? 98 : 120);
  title.setAttribute("font-size", titleFontSize); title.setAttribute("font-weight", 700);
  title.textContent = titleText;
  svg.appendChild(title);

  const tw = Math.min(1500, Math.max(400, titleText.length * (titleFontSize * 0.55)));
  TITLE_LINE = roughPath(gen, gen.line(140, 215, 140 + tw, 222), "#b5533c", 8);
  svg.appendChild(TITLE_LINE);

  // Vòng tròn số liệu bên trái - Nâng cao y=560
  CIRCLE = roughPath(gen, gen.circle(480, 560, 400, { roughness: 1.8 }), "#b5533c", 8);
  svg.appendChild(CIRCLE);

  const statNum = document.createElementNS(SVGNS, "text");
  statNum.setAttribute("x", 480); statNum.setAttribute("y", 600);
  statNum.setAttribute("font-size", 160); statNum.setAttribute("font-weight", 700);
  statNum.setAttribute("text-anchor", "middle"); statNum.setAttribute("fill", "#b5533c");
  statNum.textContent = scene.stat || "100%";
  svg.appendChild(statNum);

  // Danh sách các ý luận giải bên phải - Vùng an toàn y <= 860
  const steps = scene.steps || [];
  const top = 380, gap = Math.min(105, (860 - top) / Math.max(steps.length, 1));
  const labelFontSize = Math.min(58, Math.max(40, Math.floor(gap * 0.55)));
  ITEMS = steps.map((s, i) => {
    const y = top + i * gap;
    const bullet = roughPath(gen, gen.circle(860, y - 20, 30, { roughness: 1.8 }), "#26323d", 5);
    svg.appendChild(bullet);

    const label = document.createElementNS(SVGNS, "text");
    label.setAttribute("x", 930); label.setAttribute("y", y);
    label.setAttribute("font-size", labelFontSize);
    svg.appendChild(label);

    return { bullet, label, text: s.label || "" };
  });
}

function renderAt(t, starts) {
  const clamp = v => Math.max(0, Math.min(1, v));
  setDraw(TITLE_LINE, clamp((t - 0.15) / 0.7));
  setDraw(CIRCLE, clamp((t - 0.2) / 0.9));

  ITEMS.forEach((it, k) => {
    setDraw(it.bullet, clamp((t - starts[k]) / 0.55));
    const chars = Math.floor(clamp((t - starts[k] - 0.1) / 0.8) * it.text.length);
    it.label.textContent = it.text.slice(0, chars);
  });
}

window.__load = load; window.__renderAt = renderAt;
</script>
</body>
</html>
